name: Build Nokia SDM660 4.19 Unified Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Nokia Device Variant'
        required: true
        default: 'PL2'
        type: choice
        options:
          - PL2
          - B2N
          - DRG
          - CTL
          - C1N
          - TAS
          - SLD
          - DDV
          - generic_sdm660
  push:
    branches:
      - lineage-23.2
      - lineage-24.0
      - main
      - master

jobs:
  build:
    name: Compile 4.19 Kernel with Clang
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libelf-dev dwarves

      - name: Download AOSP Clang (r487747c)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang

      - name: Download GCC Cross-Compilers
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Configure and Build Kernel
        run: |
          DEVICE="${{ github.event.inputs.device || 'PL2' }}"
          echo "Target Device: $DEVICE"

          export PATH=$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang

          mkdir -p out

          # Base Qualcomm 4.19 defconfig
          make O=out ARCH=arm64 vendor/sdm660-perf_defconfig

          # Merge Nokia common and device-specific configs if applicable
          if [ "$DEVICE" != "generic_sdm660" ]; then
            CONFIGS_TO_MERGE="arch/arm64/configs/vendor/nokia/nokia.config"
            if [ -f "arch/arm64/configs/vendor/nokia/${DEVICE}.config" ]; then
              CONFIGS_TO_MERGE="$CONFIGS_TO_MERGE arch/arm64/configs/vendor/nokia/${DEVICE}.config"
            fi
            echo "Merging configs: $CONFIGS_TO_MERGE"
            ./scripts/kconfig/merge_config.sh -m -O out out/.config $CONFIGS_TO_MERGE
            make O=out ARCH=arm64 olddefconfig
          fi

          echo "Starting compilation with $(nproc --all) threads..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-gdwarf-4"

      - name: Package Kernel Artifacts
        run: |
          DEVICE="${{ github.event.inputs.device || 'PL2' }}"
          mkdir -p release
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb release/Image.gz-dtb-${DEVICE}
          fi
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz release/Image.gz-${DEVICE}
          fi
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image release/Image-${DEVICE}
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img release/dtbo-${DEVICE}.img
          fi
          echo ">>> Release files size:"
          ls -lh release/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-${{ github.event.inputs.device || 'PL2' }}-4.19-Kernel
          path: release/*
